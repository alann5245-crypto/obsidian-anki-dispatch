name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package zip and create GitHub Release with Obsidian plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p anki-dispatch
          cp main.js manifest.json styles.css versions.json README.md LICENSE anki-dispatch/
          zip -r "anki-dispatch-$TAG.zip" anki-dispatch
          gh release create "$TAG" \
            main.js manifest.json styles.css "anki-dispatch-$TAG.zip" \
            --title "Anki Dispatch $TAG" \
            --generate-notes
